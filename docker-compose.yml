name: terminal-prestow

services:
  # The only long-running service: the pre-stowage adjudication API.
  api:
    build:
      context: .
      target: runtime
    image: prestow-api:local
    environment:
      PORT: "8080"
    ports:
      # Publish on the host only through API_PORT (default 8080).
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # One-shot acceptance service: runs the standard-library test suite against
  # the live API and exits. Not started by a plain `docker compose up`.
  verify:
    build:
      context: .
      target: verify
    image: prestow-verify:local
    profiles: ["verify"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8080
    restart: "no"
